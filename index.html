<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Icon Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CYBER ICON HUB</h1>
        <p>Нажми на иконку, чтобы скопировать ссылку</p>
    </header>
    <div class="grid">        <div class="card" onclick="copyUrl('android.png')"><img src="icons/android.png" loading="lazy"><span>android</span></div>
        <div class="card" onclick="copyUrl('powershell.png')"><img src="icons/powershell.png" loading="lazy"><span>powershell</span></div>
        <div class="card" onclick="copyUrl('skull.png')"><img src="icons/skull.png" loading="lazy"><span>skull</span></div>
        <div class="card" onclick="copyUrl('smiley_angry.png')"><img src="icons/smiley_angry.png" loading="lazy"><span>smiley_angry</span></div>
        <div class="card" onclick="copyUrl('smiley_cool.png')"><img src="icons/smiley_cool.png" loading="lazy"><span>smiley_cool</span></div>
        <div class="card" onclick="copyUrl('smiley_devil.png')"><img src="icons/smiley_devil.png" loading="lazy"><span>smiley_devil</span></div>
        <div class="card" onclick="copyUrl('smiley_hacker.png')"><img src="icons/smiley_hacker.png" loading="lazy"><span>smiley_hacker</span></div>
        <div class="card" onclick="copyUrl('smiley_robot.png')"><img src="icons/smiley_robot.png" loading="lazy"><span>smiley_robot</span></div>
        <div class="card" onclick="copyUrl('troll.png')"><img src="icons/troll.png" loading="lazy"><span>troll</span></div>
        <div class="card" onclick="copyUrl('ai/ai_icon_1.png')"><img src="icons/ai/ai_icon_1.png" loading="lazy"><span>AI_1</span></div>
        <div class="card" onclick="copyUrl('ai/ai_icon_10.png')"><img src="icons/ai/ai_icon_10.png" loading="lazy"><span>AI_10</span></div>
        <div class="card" onclick="copyUrl('ai/ai_icon_2.png')"><img src="icons/ai/ai_icon_2.png" loading="lazy"><span>AI_2</span></div>
        <div class="card" onclick="copyUrl('ai/ai_icon_3.png')"><img src="icons/ai/ai_icon_3.png" loading="lazy"><span>AI_3</span></div>
        <div class="card" onclick="copyUrl('ai/ai_icon_4.png')"><img src="icons/ai/ai_icon_4.png" loading="lazy"><span>AI_4</span></div>
        <div class="card" onclick="copyUrl('ai/ai_icon_5.png')"><img src="icons/ai/ai_icon_5.png" loading="lazy"><span>AI_5</span></div>
        <div class="card" onclick="copyUrl('ai/ai_icon_6.png')"><img src="icons/ai/ai_icon_6.png" loading="lazy"><span>AI_6</span></div>
        <div class="card" onclick="copyUrl('ai/ai_icon_7.png')"><img src="icons/ai/ai_icon_7.png" loading="lazy"><span>AI_7</span></div>
        <div class="card" onclick="copyUrl('ai/ai_icon_8.png')"><img src="icons/ai/ai_icon_8.png" loading="lazy"><span>AI_8</span></div>
        <div class="card" onclick="copyUrl('ai/ai_icon_9.png')"><img src="icons/ai/ai_icon_9.png" loading="lazy"><span>AI_9</span></div>
    </div>
    <script>
        function copyUrl(path) {
            let fullUrl = window.location.origin + '/icons/' + path;
            navigator.clipboard.writeText('icon ' + fullUrl).then(() => {
                alert('Скопировано! Вставь в консоль: icon ' + fullUrl);
            });
        }
    </script>
</body>
</html>
